# The human gate as one deployment: the ask_human MCP endpoint plus the
# /attention safety net, writing Question objects in its own namespace.
# Sessions reach it at http://tiny-mcp.<namespace>.svc:8080/mcp — inject
# that into any agent's MCP config (kelos AgentConfig, plain settings.json).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tiny-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tiny-mcp
rules:
  - apiGroups: ["agents.tinysystems.io"]
    resources: ["questions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"] # caller-IP -> pod -> session attribution
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tiny-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tiny-mcp
subjects:
  - kind: ServiceAccount
    name: tiny-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-mcp
  labels: { app: tiny-mcp }
spec:
  replicas: 1
  selector: { matchLabels: { app: tiny-mcp } }
  template:
    metadata: { labels: { app: tiny-mcp } }
    spec:
      serviceAccountName: tiny-mcp
      containers:
        - name: server
          image: ghcr.io/tiny-systems/controller:latest
          args: ["--addr=:8080"]
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-mcp
spec:
  selector: { app: tiny-mcp }
  ports: [{ port: 8080, targetPort: 8080 }]
