# This rule is not used by the project tiny-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to agents.tinysystems.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tiny-controller
    app.kubernetes.io/managed-by: kustomize
  name: session-viewer-role
rules:
- apiGroups:
  - agents.tinysystems.io
  resources:
  - sessions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.tinysystems.io
  resources:
  - sessions/status
  verbs:
  - get
