---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sessions.agents.tinysystems.io
spec:
  group: agents.tinysystems.io
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    singular: session
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.task
      name: Task
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Session is one coding-agent session running as a workload: a pod holding
          the agent and its MCP sidecar, and a persistent workspace that outlives the
          pod so the session resumes where it stopped.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'SessionSpec is what a session runs: one agent, one task,
              one workspace.'
            properties:
              image:
                description: |-
                  Agent image to run. The image owns how the agent is started (tmux,
                  resume, hooks); the controller only wires task, workspace and sidecar.
                type: string
              repo:
                description: |-
                  Repo to clone into the workspace before the agent starts. Optional —
                  a session can start on an empty workspace.
                type: string
              task:
                description: Task the agent starts with.
                minLength: 1
                type: string
              workspaceSize:
                description: WorkspaceSize is the persistent workspace request. Defaults
                  to 2Gi.
                type: string
            required:
            - task
            type: object
          status:
            description: SessionStatus is what the controller observed.
            properties:
              message:
                description: Message says why, when a phase needs explaining.
                type: string
              phase:
                description: Phase mirrors the workload's coarse state.
                enum:
                - Pending
                - Running
                - Done
                - Failed
                type: string
              pod:
                description: Pod running the session, when one exists.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
